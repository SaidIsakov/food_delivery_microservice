services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "8000:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
    volumes:
      - ./catalog-service:/app

  order-service:
    build: ./order-service
    ports:
      - "8001:8001"
    environment:
      - CATALOG_URL=http://catalog-service:8000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - KAFKA_BOOTSTRAP_SERVER=kafka:29092
      - KAFKA_ANALITIC_ORDER_TOPIC=order-events
    volumes:
      - ./order-service:/app
    depends_on:
      catalog-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  delivery-service:
    build: ./delivery-service
    ports:
     - "8005:8005"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - ./delivery-service/:/app
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    ports:
      - "8007:8007"
    volumes:
      - ./auth-service:/app
    depends_on:
      auth-db:
        condition: service_healthy

  analytic-service:
    build: ./analytic-service
    ports:
     - "8006:8006"
    environment:
      - MONGODB_URL=mongodb://analytics:analytics@mongodb:27017/analytics?authSource=admin
      - MONGODB_DATABASE=analytics
      - MONGODB_COLLECTION=events
      - KAFKA_BOOTSTRAP_SERVER=kafka:29092
      - KAFKA_ANALITIC_ORDER_TOPIC=order-events
    volumes:
      - ./analytic-service/:/app
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    ports:
      - "8003:8003"
    environment:
      - AUTH_URL=http://auth-service:8007
      - CATALOG_URL=http://catalog-service:8000
      - ORDER_URL=http://order-service:8001
    volumes:
      - ./api-gateway/:/app
    depends_on:
      - catalog-service
      - order-service

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    expose:
      - "5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    expose:
      - "5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 5s
      timeout: 5s
      retries: 10

  delivery-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    expose:
      - "5432"
    volumes:
      - delivery-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    expose:
      - "5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "${KAFKA_BIND_HOST}:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  mongodb:
    image: mongo:8.0
    attach: false
    command: ["--quiet"]
    logging:
      driver: "none"
    environment:
      MONGO_INITDB_ROOT_USERNAME: analytics
      MONGO_INITDB_ROOT_PASSWORD: analytics
    expose:
      - "27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "analytics", "--password", "analytics", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalog-db-data:
  order-db-data:
  delivery-db-data:
  auth-db-data:
  kafka-data:
  mongodb-data:
